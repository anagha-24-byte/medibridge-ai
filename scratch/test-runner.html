<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediBridge AI — Automated Test Suite</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .test-box { padding: 12px; margin-bottom: 8px; border-radius: 8px; font-family: monospace; font-size: 13px; }
    .pass { background: #064e3b; border: 1px solid #059669; color: #6ee7b7; }
    .fail { background: #7f1d1d; border: 1px solid #dc2626; color: #fca5a5; }
    #summary { font-size: 18px; font-weight: bold; margin-bottom: 16px; padding: 12px; border-radius: 8px; }
    #summary.all-pass { background: #047857; color: white; }
    #summary.has-fail { background: #b91c1c; color: white; }
  </style>
  <script src="../js/samples.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/appointments.js"></script>
  <script src="../js/xray.js"></script>
  <script src="../js/bloodtest.js"></script>
  <script src="../js/explainer.js"></script>
  <script src="../js/assistant.js"></script>
  <script src="../js/hospitals.js"></script>
</head>
<body>
  <h1>MediBridge AI Automated Test Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>

  <script>
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    let passCount = 0;
    let failCount = 0;

    async function runTest(name, testFn) {
      const box = document.createElement('div');
      try {
        await testFn();
        box.className = 'test-box pass';
        box.innerHTML = `<strong>✅ ${name}</strong><pre>PASSED</pre>`;
        passCount++;
      } catch (err) {
        box.className = 'test-box fail';
        box.innerHTML = `<strong>❌ ${name}</strong><pre>${err.message}\n${err.stack || ''}</pre>`;
        failCount++;
      }
      resultsEl.appendChild(box);
    }

    async function executeAllTests() {
      // Test 1: Simplifier is removed and Appointments exists
      await runTest('Test 1: Appointments & Reminders module loaded', () => {
        if (!window.appointmentsManager) throw new Error('appointmentsManager is not defined');
        if (typeof window.appointmentsManager.createAppointment !== 'function') throw new Error('createAppointment method missing');
      });

      // Test 2: Vault is removed from global scope
      await runTest('Test 2: Vault module is completely removed', () => {
        if (typeof VaultManager !== 'undefined' || typeof window.vaultManager !== 'undefined') {
          throw new Error('VaultManager is still present in global scope');
        }
      });

      // Test 3: Dedicated X-Ray Analysis module loaded
      await runTest('Test 3: X-Ray Analysis manager loaded and validates formats', () => {
        if (!window.xrayManager) throw new Error('xrayManager missing');
        const validJpeg = window.xrayManager.validateImageFile({ type: 'image/jpeg', size: 1024 * 1024 });
        if (!validJpeg.valid) throw new Error('Valid JPEG was rejected');
        const invalidPdf = window.xrayManager.validateImageFile({ type: 'application/pdf', size: 1024 });
        if (invalidPdf.valid) throw new Error('PDF should be rejected for X-ray image analysis');
      });

      // Test 4: Dedicated Blood Test Analysis extracts parameters
      await runTest('Test 4: Blood Test Analysis extracts parameters and flags ranges', async () => {
        if (!window.bloodTestManager) throw new Error('bloodTestManager missing');
        const sampleText = `
          PATIENT LAB REPORT:
          Fasting Blood Glucose: 125 mg/dL
          Hemoglobin A1c: 6.2 %
          Hemoglobin: 11.5 g/dL
          Total Cholesterol: 220 mg/dL
          Serum Creatinine: 0.9 mg/dL
        `;
        const res = await window.bloodTestManager.processReport(sampleText, 'Sample Test');
        if (!res.success) throw new Error('Blood test parsing failed');
        if (!res.extractedValues || res.extractedValues.length < 4) throw new Error(`Extracted ${res.extractedValues.length} parameters, expected >= 4`);
        const gluc = res.extractedValues.find(v => v.id === 'fasting_glucose');
        if (!gluc || gluc.flag !== 'HIGH') throw new Error('Fasting glucose 125 mg/dL should be flagged HIGH');
      });

      // Test 5: Blood Test rejects non-medical text
      await runTest('Test 5: Blood Test rejects non-medical text', async () => {
        const nonMedical = 'The project plan includes a sprint review on Monday and deployment on Friday.';
        const res = await window.bloodTestManager.processReport(nonMedical, 'Project Doc');
        if (res.success) throw new Error('Non-medical text was accepted as a blood test report');
        if (res.error !== 'NOT_BLOOD_TEST') throw new Error(`Expected NOT_BLOOD_TEST, got ${res.error}`);
      });

      // Test 6: Document Explainer rejects non-medical files with exact prompt error
      await runTest('Test 6: Document Explainer rejects non-medical document with exact error', () => {
        const explainer = new DocumentExplainer();
        const nonMedical = 'My resume: Software Engineer with experience in Python, Git, and Docker.';
        const res = explainer.analyzeDocument(nonMedical);
        if (res.success) throw new Error('Non-medical text was accepted');
        const expected = "This document does not appear to contain medical information. Please upload a medical report or document.";
        if (res.error !== expected) throw new Error(`Expected exact error message "${expected}", got "${res.error}"`);
      });

      // Test 7: Document Explainer processes valid clinical document
      await runTest('Test 7: Document Explainer processes valid clinical discharge summary', () => {
        const explainer = new DocumentExplainer();
        const sample = SAMPLE_DOCUMENTS.discharge_summary;
        if (!sample) throw new Error('Sample discharge summary missing');
        const res = explainer.analyzeDocument(sample.rawText);
        if (!res.success) throw new Error(`Clinical document failed: ${res.error}`);
        if (!res.doctorQuestions || res.doctorQuestions.length === 0) throw new Error('No doctor questions generated');
      });

      // Test 8: Nearby Hospitals resolves location and calculates distance
      await runTest('Test 8: Nearby Hospitals calculates distance and sorts facilities', async () => {
        const mgr = new NearbyHospitalsManager();
        // Bengaluru coordinates: 12.9716, 77.5946
        const list = await mgr.getNearbyHospitals(12.9716, 77.5946, 10);
        if (!list || list.length === 0) throw new Error('No hospitals returned for Bengaluru');
        if (typeof list[0].distance !== 'number') throw new Error('Distance was not computed');
        if (list.length > 1 && list[0].distance > list[1].distance) throw new Error('Hospitals not sorted nearest-first');
      });

      // Test 9: Auth validation - Name and Mobile format
      await runTest('Test 9: AuthManager validates Name and Mobile number', () => {
        const auth = window.authManager;
        const valid = auth.validateInput('Anagha S', '9876543210');
        if (!valid.valid) throw new Error(`Valid input was rejected: ${valid.error}`);
        const invalidMobile = auth.validateInput('Anagha S', '12345');
        if (invalidMobile.valid) throw new Error('Invalid short mobile number was accepted');
        const invalidName = auth.validateInput('A', '9876543210');
        if (invalidName.valid) throw new Error('Invalid single-letter name was accepted');
      });

      // Test 10: Auth login session creation & logout
      await runTest('Test 10: AuthManager login session and logout flow', async () => {
        const auth = window.authManager;
        const res = await auth.login('Anagha Student', '9876543210');
        if (!res.success) throw new Error('Login failed');
        if (!auth.isAuthenticated()) throw new Error('User not marked as authenticated');
        if (auth.user.name !== 'Anagha Student') throw new Error('User name mismatch');
        await auth.logout();
        if (auth.isAuthenticated()) throw new Error('User still authenticated after logout');
      });

      // Test 11: Appointments Manager prevents past dates
      await runTest('Test 11: AppointmentsManager rejects past dates', async () => {
        const appts = window.appointmentsManager;
        const pastRes = await appts.createAppointment({
          hospitalName: 'Victoria Hospital',
          date: '2020-01-01',
          time: '10:00',
          purpose: 'Past Checkup'
        });
        if (pastRes.success) throw new Error('Past appointment date was accepted');
      });

      // Test 12: Appointments Manager saves and deletes future appointments
      await runTest('Test 12: AppointmentsManager creates and deletes valid appointment', async () => {
        const appts = window.appointmentsManager;
        const futureDate = new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0];
        const res = await appts.createAppointment({
          hospitalName: 'Victoria Hospital (BMCRI)',
          hospitalAddress: 'Fort Road, Bengaluru',
          hospitalPhone: '+91-80-26701150',
          date: futureDate,
          time: '11:00',
          purpose: 'Cardiology Follow-up',
          reminderEnabled: true,
          reminderTime: '1_hour_before',
          status: 'Reminder Saved'
        });
        if (!res.success || !res.appointment) throw new Error('Failed to create appointment');
        const apptId = res.appointment.id;
        await appts.deleteAppointment(apptId);
        const found = appts.appointments.find(a => a.id === apptId);
        if (found) throw new Error('Appointment was not deleted');
      });

      // Test 13: Health Assistant red-flag emergency detection
      await runTest('Test 13: Health Assistant red-flag emergency triage', async () => {
        const assistant = new HealthAssistant();
        const res = await assistant.processMessage('I have crushing chest pain spreading down my left arm and severe shortness of breath');
        if (!res) throw new Error('No response returned');
        if (res.type !== 'emergency') throw new Error(`Expected emergency response, got ${res.type}`);
        if (!res.urgentAction) throw new Error('Urgent action flag not set for emergency');
      });

      // Test 14: Health Assistant non-diagnostic refusal guardrail
      await runTest('Test 14: Health Assistant non-diagnostic refusal guardrail', async () => {
        const assistant = new HealthAssistant();
        const res = await assistant.processMessage('Please diagnose if this cough means I have lung cancer');
        if (!res) throw new Error('No response returned');
        if (res.type !== 'guardrail_diagnosis') throw new Error(`Expected guardrail_diagnosis, got ${res.type}`);
      });

      // Test 15: Health Assistant prescription dosage refusal guardrail
      await runTest('Test 15: Health Assistant prescription dosage refusal guardrail', async () => {
        const assistant = new HealthAssistant();
        const res = await assistant.processMessage('How many milligrams of amoxicillin should I take?');
        if (!res) throw new Error('No response returned');
        if (res.type !== 'guardrail_prescription') throw new Error(`Expected guardrail_prescription, got ${res.type}`);
      });

      // Test 16: Health Assistant offers hospital & appointment follow-up
      await runTest('Test 16: Health Assistant offers hospital & appointment follow-up', async () => {
        const assistant = new HealthAssistant();
        const res = await assistant.processMessage('What are the symptoms and stages of type 2 diabetes?');
        if (!res) throw new Error('No response returned');
        if (!res.offerHospitalAssistance) throw new Error('Assistant did not offer hospital assistance');
      });

      // Test 17: Multilingual translations exist for key features
      await runTest('Test 17: UI_TRANSLATIONS contains appointments, xray, and blood test keys', () => {
        if (!UI_TRANSLATIONS.en.navAppointments) throw new Error('navAppointments missing in English');
        if (!UI_TRANSLATIONS.en.navXray) throw new Error('navXray missing in English');
        if (!UI_TRANSLATIONS.en.navBloodTest) throw new Error('navBloodTest missing in English');
        if (!UI_TRANSLATIONS.hi.navAppointments) throw new Error('navAppointments missing in Hindi');
        if (!UI_TRANSLATIONS.kn.navAppointments) throw new Error('navAppointments missing in Kannada');
      });

      // Test 18: Emergency contact numbers integrity
      await runTest('Test 18: Emergency hotline 112 / 108 verification', () => {
        const hospital = new NearbyHospitalsManager();
        const vHosp = hospital.verifiedHospitals[0];
        if (!vHosp || !vHosp.phone) throw new Error('Apex hospital missing verified phone');
        if (vHosp.phone === '112') throw new Error('Hospital phone falsely set to 112 instead of hospital line');
      });

      // Summary
      summaryEl.className = failCount === 0 ? 'all-pass' : 'has-fail';
      summaryEl.innerHTML = `Completed: ${passCount} Passed, ${failCount} Failed. Total: ${passCount + failCount}`;
    }

    window.addEventListener('DOMContentLoaded', executeAllTests);
  </script>
</body>
</html>
